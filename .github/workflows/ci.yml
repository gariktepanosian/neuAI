name: CI — Build, Test, Security Scan & Image Sign

on:
  push:
    branches: [ "main", "develop", "release/**" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  REGISTRY: us-central1-docker.pkg.dev
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_REPO: nutrihealth

jobs:
  # ──────────────────────────────────────────────
  # 1. Build + Unit-test every Java microservice
  # ──────────────────────────────────────────────
  build-and-test:
    name: Build & Test — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-auth-service
          - clinic-diagnostic-service
          - subscription-order-service
          - ai-nutrition-engine-service
          - logistics-dispatch-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build, test & verify coverage
        working-directory: ${{ matrix.service }}
        run: mvn -B verify --no-transfer-progress
        # JaCoCo check goal is bound to 'verify'; build fails if <85% branch coverage

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/

  # ──────────────────────────────────────────────
  # 2. SonarQube static analysis
  # ──────────────────────────────────────────────
  sonarqube:
    name: SonarQube — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-auth-service
          - clinic-diagnostic-service
          - subscription-order-service
          - ai-nutrition-engine-service
          - logistics-dispatch-service

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for blame/history in Sonar

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run SonarQube analysis
        working-directory: ${{ matrix.service }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B verify sonar:sonar \
            -Dsonar.projectKey=nutrihealth-${{ matrix.service }} \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.login=${SONAR_TOKEN} \
            --no-transfer-progress

  # ──────────────────────────────────────────────
  # 3. OWASP dependency vulnerability scan
  # ──────────────────────────────────────────────
  owasp-scan:
    name: OWASP Dependency Check — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-auth-service
          - clinic-diagnostic-service
          - subscription-order-service
          - ai-nutrition-engine-service
          - logistics-dispatch-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: OWASP Dependency-Check
        working-directory: ${{ matrix.service }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DnvdApiKey=${NVD_API_KEY} \
            --no-transfer-progress

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-${{ matrix.service }}
          path: ${{ matrix.service }}/target/dependency-check-report.html

  # ──────────────────────────────────────────────
  # 4. Build & push container images (main/release only)
  # ──────────────────────────────────────────────
  build-image:
    name: Build & Push Image — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [ build-and-test ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    permissions:
      contents: read
      id-token: write   # for Workload Identity Federation

    strategy:
      fail-fast: false
      matrix:
        service:
          - user-auth-service
          - clinic-diagnostic-service
          - subscription-order-service
          - ai-nutrition-engine-service
          - logistics-dispatch-service

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGISTRY} --quiet

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build fat JAR
        working-directory: ${{ matrix.service }}
        run: mvn -B package -DskipTests --no-transfer-progress

      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | head -c 8)
          echo "IMAGE=${REGISTRY}/${PROJECT_ID}/${GAR_REPO}/${{ matrix.service }}:${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "IMAGE_LATEST=${REGISTRY}/${PROJECT_ID}/${GAR_REPO}/${{ matrix.service }}:latest" >> $GITHUB_OUTPUT

      - name: Build Docker image
        working-directory: ${{ matrix.service }}
        run: |
          docker build \
            -t ${{ steps.tag.outputs.IMAGE }} \
            -t ${{ steps.tag.outputs.IMAGE_LATEST }} \
            .

      - name: Push Docker image
        run: |
          docker push ${{ steps.tag.outputs.IMAGE }}
          docker push ${{ steps.tag.outputs.IMAGE_LATEST }}

      # ── Trivy container vulnerability scan ──────────────────────────────
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.tag.outputs.IMAGE }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      # ── Cosign keyless image signing (SLSA provenance) ──────────────────
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign (keyless / OIDC)
        run: |
          cosign sign --yes ${{ steps.tag.outputs.IMAGE }}

  # ──────────────────────────────────────────────
  # 5. Flutter mobile app build & test
  # ──────────────────────────────────────────────
  flutter:
    name: Flutter Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"
          cache: true

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Flutter analyze
        working-directory: mobile
        run: flutter analyze --no-pub

      - name: Flutter test
        working-directory: mobile
        run: flutter test --coverage

      - name: Upload Flutter coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: mobile/coverage/lcov.info

  # ──────────────────────────────────────────────
  # 6. Terraform validate (infra changes)
  # ──────────────────────────────────────────────
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init (no backend)
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Terraform Format Check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
