name: nutrihealth_mobile
description: NutriHealth AI — personalised nutrition, diagnostics & meal delivery mobile application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Networking & serialisation ──────────────────────────────────────────
  dio: ^5.7.0                        # HTTP client with interceptors
  retrofit: ^4.4.1                   # Type-safe REST client generator
  json_annotation: ^4.9.0            # JSON serialisation annotations

  # ── State management ────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1           # Reactive state management
  riverpod_annotation: ^2.6.1

  # ── Navigation ──────────────────────────────────────────────────────────
  go_router: ^14.3.0                 # Declarative navigation

  # ── Authentication & security ───────────────────────────────────────────
  flutter_secure_storage: ^9.2.2     # Keychain / Keystore token storage
  local_auth: ^2.3.0                 # Fingerprint / Face ID biometric auth
  jwt_decoder: ^2.0.1                # JWT parsing (no validation — server-side)

  # ── Maps & geolocation (Phase 3.5: courier tracking) ────────────────────
  google_maps_flutter: ^2.9.0        # Google Maps SDK
  geolocator: ^13.0.1                # Device GPS

  # ── File upload (Phase 3.4: diagnostics portal) ─────────────────────────
  file_picker: ^8.1.2                # Pick PDF/image lab reports
  image_picker: ^1.1.2               # Camera or gallery

  # ── UI & charts ─────────────────────────────────────────────────────────
  fl_chart: ^0.69.0                  # Nutrition macro charts
  cached_network_image: ^3.4.1       # Image caching
  intl: ^0.19.0                      # Date / number formatting
  shimmer: ^3.0.0                    # Loading placeholders

  # ── Push notifications ──────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3        # FCM push notifications

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  retrofit_generator: ^9.1.6
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.1
  mockito: ^5.4.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: NutriSans
      fonts:
        - asset: assets/fonts/NutriSans-Regular.ttf
        - asset: assets/fonts/NutriSans-Bold.ttf
          weight: 700
