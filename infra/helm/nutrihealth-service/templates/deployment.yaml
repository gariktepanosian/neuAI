apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nutrihealth-service.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nutrihealth-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nutrihealth-service.selectorLabels" . | nindent 6 }}
      track: stable
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # zero-downtime: never take pods below replicaCount
  template:
    metadata:
      labels:
        {{- include "nutrihealth-service.selectorLabels" . | nindent 8 }}
        track: stable
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ include "nutrihealth-service.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
      volumes:
        {{- toYaml .Values.extraVolumes | nindent 8 }}
      terminationGracePeriodSeconds: 60   # allow in-flight requests to complete
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "nutrihealth-service.selectorLabels" . | nindent 14 }}
---
{{- if .Values.canary.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nutrihealth-service.fullname" . }}-canary
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nutrihealth-service.labels" . | nindent 4 }}
    track: canary
spec:
  # Canary receives (canary.weight)% of replicas relative to stable.
  replicas: {{ ceil (mul .Values.replicaCount (div .Values.canary.weight 100.0)) | int }}
  selector:
    matchLabels:
      {{- include "nutrihealth-service.selectorLabels" . | nindent 6 }}
      track: canary
  template:
    metadata:
      labels:
        {{- include "nutrihealth-service.selectorLabels" . | nindent 8 }}
        track: canary
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ include "nutrihealth-service.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      terminationGracePeriodSeconds: 60
{{- end }}
