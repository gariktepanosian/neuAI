# Phase 1, Step 1.3: business event topics + a matching `.dlq` topic per
# topic, per the spec's "dead-letter queue (DLQ) strategy" requirement.
#
# DLQ strategy: producers publish directly to the main topic. Any future
# consumer should wrap its listener in Spring Kafka's `DefaultErrorHandler`
# configured with a `DeadLetterPublishingRecoverer` pointed at `<topic>.dlq`,
# so a message that fails processing after retries lands on the DLQ topic
# instead of being dropped or blocking the partition. DLQ topics get longer
# retention (7 days) than their source topics (3 days) to give ops time to
# investigate before the message ages out.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: subscription.payment.paid
  namespace: kafka
  labels:
    strimzi.io/cluster: nutrihealth-kafka
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 259200000 # 3 days
    min.insync.replicas: 2
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: subscription.payment.paid.dlq
  namespace: kafka
  labels:
    strimzi.io/cluster: nutrihealth-kafka
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 604800000 # 7 days
    min.insync.replicas: 2
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: subscription.payment.failed
  namespace: kafka
  labels:
    strimzi.io/cluster: nutrihealth-kafka
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 259200000
    min.insync.replicas: 2
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: subscription.payment.failed.dlq
  namespace: kafka
  labels:
    strimzi.io/cluster: nutrihealth-kafka
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 604800000
    min.insync.replicas: 2
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: diagnostic.report.ingested
  namespace: kafka
  labels:
    strimzi.io/cluster: nutrihealth-kafka
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 259200000
    min.insync.replicas: 2
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
